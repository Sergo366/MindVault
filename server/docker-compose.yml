version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: fitly-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      target: development # Use the development stage from the Dockerfile
    container_name: fitly-api
    ports:
      - '4001:4001'
      - '9229:9229' # For debugging
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - redis
    command: npm run start:debug

volumes:
  redis-data:
